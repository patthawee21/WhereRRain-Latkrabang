name: Run Flask

on:
  workflow_dispatch:

jobs:
  flask:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Flask
        run: |
          python app.py &
          sleep 10
          curl http://127.0.0.1:5000
